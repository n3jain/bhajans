<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sai Sankalp — 9 Thursdays with Sai</title><style>body{font:16px system-ui;background:#fff9ef;color:#442d19;max-width:680px;margin:auto;padding:20px}h1,h2,h3{line-height:1.2}section{background:white;border:1px solid #e8d8bf;border-radius:12px;padding:16px;margin:12px 0}label{display:block;padding:8px 0}input,button{font:inherit;padding:9px;margin:4px;border:1px solid #bda47f;border-radius:8px}button{background:#f5e2bd;color:#442d19;cursor:pointer}a{color:#805015}#message{color:#79502d} [hidden]{display:none!important}</style></head><body><a href="index.html">← Bhajan Notebook</a><h1>Sai Sankalp</h1><h2>9 Thursdays with Sai</h2><p>श्रद्धा और सबुरी · ॐ साईं राम</p><section><h2>Thursday Puja</h2><p><a href="https://open.spotify.com/playlist/1L4AwNZKi9h6f1LhgWL82S">Listen to Thursday Puja</a></p><p><a href="https://open.spotify.com/show/7bok6lkMslhUnMStCSJiLe">Original Sai Puja podcast</a></p><p><a href="https://hindunidhi.com/sai-baba-vrat-katha-hindi/pdf/">साईं बाबा व्रत कथा — read original</a></p><p><a href="https://www.amazon.in/dp/B08LQQN7T8">Udyapan books (set of 11)</a></p></section><p id="message" role="status"></p><section id="auth"><h2>Sign in to track your sankalp</h2><label>Email <input id="email" type="email" autocomplete="email"></label><label>Password <input id="password" type="password" autocomplete="current-password"></label><button id="signin">Sign in</button><button id="signup">Create account</button><button id="reset">Forgot password</button></section><section id="recovery" hidden><label>New password <input id="newpassword" type="password" autocomplete="new-password"></label><button id="change">Update password</button></section><div id="private" hidden><button id="logout">Sign out</button><h2 id="progress"></h2><section id="new"><label>Starting Thursday <input type="date" id="date"></label><button id="start">Start sankalp</button></section><div id="weeks"></div><h2>Completed sankalps</h2><div id="history"></div></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.75.0/dist/umd/supabase.min.js"></script><script>const count=e=>!e?.skip&&e?.puja===true&&e?.fast===true;
const add=(d,n)=>{const x=new Date(d+'T12:00:00Z');x.setUTCDate(x.getUTCDate()+n);return x.toISOString().slice(0,10)};
const today=z=>new Intl.DateTimeFormat('en-CA',{timeZone:z,year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date());
const completed=e=>Object.values(e).filter(count).length;
const rows=(start,entries,now)=>{let result=[],n=0;for(let d=start; n<9 && result.length<2000;d=add(d,7)){const e=entries[d]||{};result.push({d,e,n:n+1,future:d>now});if(count(e)||d>now)n++;}return result};
const tests=()=>{const a={'2026-11-26':{puja:true,fast:true},'2026-12-03':{skip:true}};if(completed(a)!==1||rows('2026-11-26',a,'2026-12-03').at(-1).d!=='2027-01-28'||count({fast:true})||count({puja:true})||add('2026-12-31',7)!=='2027-01-07')throw Error('logic test failed');};
tests();
const db=supabase.createClient('https://fssdfwgcrefwsihowofz.supabase.co','sb_publishable_St_uGRfOiZ2Za-KWrfbfKA_mUzbkK5P');
const $=id=>document.getElementById(id);let user,journey,busy=false;
function msg(s){$('message').textContent=s||''}
async function run(fn){if(busy)return;busy=true;try{await fn()}catch(e){msg(e.message||String(e))}finally{busy=false}}
function ok(r){if(r.error)throw r.error;return r.data}
async function load(){user=(await db.auth.getUser()).data.user;$('auth').hidden=!!user;$('private').hidden=!user;if(!user)return;const all=ok(await db.from('sai_sankalps').select('*').order('created_at',{ascending:false}));journey=all.find(x=>!x.completed_at);$('history').replaceChildren(...all.filter(x=>x.completed_at).map(x=>{const p=document.createElement('p');p.textContent=x.start_date+' — 9 vrats and Udyapan complete';return p}));$('new').hidden=!!journey;render()}
function render(){const list=$('weeks');list.replaceChildren();if(!journey){$('progress').textContent='Begin a new sankalp';return}const e=journey.entries;const n=completed(e);$('progress').textContent=n+' / 9 vrats · Started '+journey.start_date+(n===9?' · Udyapan pending':'');const now=today(journey.timezone);for(const r of rows(journey.start_date,e,now)){const box=document.createElement('section');const title=document.createElement('h3');title.textContent=r.d+' · '+(r.e.skip?'Skipped':'Vrat '+r.n);box.append(title);if(!r.future){const fields=[...(r.n===1?[['sankalp','Sankalp started']]:[]),['puja','Sai Puja'],['temple','Temple visit (optional)'],['fast','Fast completed'],...(r.n===9?[['books','Books distributed'],['food','Fed people']]:[])];for(const [k,label] of fields){const l=document.createElement('label'),c=document.createElement('input');c.type='checkbox';c.checked=!!r.e[k];c.disabled=!!r.e.skip;c.onchange=()=>run(async()=>{try{await save(r.d,{...r.e,[k]:c.checked})}finally{render()}});l.append(c,document.createTextNode(label));box.append(l)}const b=document.createElement('button');b.textContent=r.e.skip?'Undo skip':'Skip Thursday';b.onclick=()=>run(()=>save(r.d,r.e.skip?{}:{skip:true}));box.append(b)}else{const p=document.createElement('p');p.textContent='Upcoming Thursday';box.append(p)}list.append(box)}}
async function save(d,e){const entries={...journey.entries,[d]:e};const r=ok(await db.from('sai_sankalps').update({entries}).eq('id',journey.id).eq('revision',journey.revision).select());if(!r.length){await load();throw Error('Progress changed on another device. Please try again.')}await load();msg('Saved')}
$('signin').onclick=()=>run(async()=>{ok(await db.auth.signInWithPassword({email:$('email').value,password:$('password').value}));await load()});
$('signup').onclick=()=>run(async()=>{const r=ok(await db.auth.signUp({email:$('email').value,password:$('password').value,options:{emailRedirectTo:location.origin+'/sai-sankalp.html'}}));if(!r.session)msg('Check your email to confirm your account.');await load()});
$('reset').onclick=()=>run(async()=>{ok(await db.auth.resetPasswordForEmail($('email').value,{redirectTo:location.origin+'/sai-sankalp.html'}));msg('Check your email for the reset link.')});
$('logout').onclick=()=>run(async()=>{ok(await db.auth.signOut());await load()});
$('start').onclick=()=>run(async()=>{const d=$('date').value,z=Intl.DateTimeFormat().resolvedOptions().timeZone;if(!d||new Date(d+'T12:00:00Z').getUTCDay()!==4||d>today(z))throw Error('Choose a Thursday on or before today.');ok(await db.from('sai_sankalps').insert({start_date:d,timezone:z}));await load()});
db.auth.onAuthStateChange(event=>{if(event==='PASSWORD_RECOVERY'){$('recovery').hidden=false;}});
$('change').onclick=()=>run(async()=>{ok(await db.auth.updateUser({password:$('newpassword').value}));$('recovery').hidden=true;msg('Password updated');await load()});
run(load);
</script></body></html>
